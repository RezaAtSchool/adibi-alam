
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>کارهای من | برنامه روزانه</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f5fb;
      color: #243047;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 10px;
      color: #293c75;
    }

    header p {
      color: #718096;
      font-size: 14px;
      line-height: 1.9;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #2538580d;
      margin-bottom: 18px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #dce2ee;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #6379db;
      box-shadow: 0 0 0 3px #6379db20;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      transition: 0.2s;
    }

    .add-btn {
      background: #5269d8;
      color: white;
      padding: 0 20px;
      font-size: 14px;
      white-space: nowrap;
    }

    .add-btn:hover {
      background: #3d52bb;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary h2 {
      font-size: 17px;
      margin: 0;
    }

    .counter {
      font-size: 12px;
      color: #5269d8;
      background: #edf0ff;
      padding: 8px 12px;
      border-radius: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .task:last-child {
      border-bottom: none;
    }

    .task input[type="checkbox"] {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      accent-color: #5269d8;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .task.done .task-text {
      color: #9aa3b4;
      text-decoration: line-through;
    }

    .delete-btn {
      background: #fff0f0;
      color: #d34c5b;
      padding: 8px 10px;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #ffdddd;
    }

    .empty {
      text-align: center;
      padding: 28px 8px;
      color: #8993a6;
      font-size: 14px;
      line-height: 2;
    }

    .progress-area {
      margin-top: 20px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: #718096;
      margin-bottom: 10px;
    }

    .progress-track {
      height: 8px;
      background: #edf0f7;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #5269d8;
      border-radius: 20px;
      transition: width 0.3s;
    }

    footer {
      text-align: center;
      color: #929bad;
      font-size: 12px;
      padding: 10px;
    }

    @media (max-width: 420px) {
      body {
        padding: 22px 12px;
      }

      .card {
        padding: 18px;
      }

      h1 {
        font-size: 24px;
      }

      .input-area {
        flex-direction: column;
      }

      .add-btn {
        padding: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo">📝</div>
      <h1>کارهای من</h1>
      <p>
        قدم‌های کوچک امروز، موفقیت‌های بزرگ فردا!
        <br>
        کارهایت را بنویس و یکی‌یکی انجامشان بده.
      </p>
    </header>

    <section class="card">
      <form id="task-form" class="input-area">
        <input
          id="task-input"
          type="text"
          placeholder="مثلاً: مرور درس ریاضی"
          maxlength="150"
          autocomplete="off"
          aria-label="عنوان کار جدید"
          required
        >
        <button class="add-btn" type="submit">+ افزودن کار</button>
      </form>
    </section>

    <section class="card">
      <div class="summary">
        <h2>فهرست کارها</h2>
        <span class="counter" id="counter">۰ کار</span>
      </div>

      <ul id="task-list"></ul>

      <div id="empty-message" class="empty">
        🌱 هنوز کاری اضافه نکرده‌ای.
        <br>
        اولین کار امروزت را بنویس!
      </div>

      <div class="progress-area">
        <div class="progress-label">
          <span>میزان پیشرفت</span>
          <span id="progress-text">۰٪</span>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="میزان پیشرفت کارها"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="progress-track"
        >
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </section>

    <footer>
      ساخته‌شده با HTML، CSS و JavaScript 💙
    </footer>
  </main>

  <script>
    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const taskList = document.getElementById("task-list");
    const counter = document.getElementById("counter");
    const emptyMessage = document.getElementById("empty-message");
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const progressTrack = document.getElementById("progress-track");

    // فهرست کارها در حافظه صفحه نگهداری می‌شود.
    let tasks = [];

    function renderTasks() {
      taskList.replaceChildren();

      tasks.forEach(function(task) {
        const item = document.createElement("li");
        item.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "تغییر وضعیت کار");

        checkbox.addEventListener("change", function() {
          task.done = checkbox.checked;
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "حذف";
        deleteButton.setAttribute("aria-label", "حذف " + task.text);

        deleteButton.addEventListener("click", function() {
          tasks = tasks.filter(function(currentTask) {
            return currentTask.id !== task.id;
          });

          renderTasks();
        });

        item.append(checkbox, text, deleteButton);
        taskList.appendChild(item);
      });

      const total = tasks.length;
      const completed = tasks.filter(function(task) {
        return task.done;
      }).length;

      const percent = total === 0
        ? 0
        : Math.round((completed / total) * 100);

      counter.textContent = total + " کار";
      emptyMessage.hidden = total > 0;
      progressBar.style.width = percent + "%";
      progressText.textContent = percent + "٪";
      progressTrack.setAttribute("aria-valuenow", percent);
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        done: false
      });

      input.value = "";
      input.focus();

      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
